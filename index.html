<script>
        // 1. 성경 통독표 데이터
        const fullBibleData = [["창1-3","레7-9","신20-22","삼하1-3","대상19-21","욥16-18","시100-104","사13-15","렘40-42","호10-14","눅4-6","고전7-9"],["창4-7","레10-12","신23-25","삼하4-6","대상22-24","욥19-21","시105-108","사16-18","렘43-45","욜1-3","눅7-9","고전10-12"],["창8-11","레13-15","신26-28","삼하7-9","대상25-27","욥22-24","시109-113","사19-21","렘46-48","암1-3","눅10-12","고전13-16"],["창12-14","레16-18","신29-31","삼하10-12","대상28-29","욥25-27","시114-118","사22-24","렘49-50","암4-6","눅13-15","고후1-3"],["창15-17","레19-21","신32-34","삼하13-15","대하1-3","욥28-30","시119:1","사25-27","렘51-52","암7-9","눅16-18","고후4-6"],["창18-20","레22-24","수1-3","삼하16-18","대하4-6","욥31-33","시119:89","사28-30","애1-3","옵-욘4","눅19-21","고후7-9"],["창21-24","레25-27","수4-7","삼하19-21","대하7-9","욥34-36","시120-125","사31-33","애4-5","미1-3","눅22-24","고후10-13"],["창25-27","민1-3","수8-9","삼하22-24","대하10-12","욥37-39","시126-131","사34-36","겔1-3","미4-7","요1-3","갈1-3"],["창28-30","민4-6","수10-12","왕상1-3","대하13-15","욥40-42","시132-137","사37-39","겔4-6","나1-합3","요4-6","갈4-6"],["창31-33","민7-9","수13-15","왕상4-6","대하16-18","시1-4","시138-143","사40-42","겔7-9","습1-학2","요7-9","엡1-3"],["창34-36","민10-12","수16-18","왕상7-9","대하19-21","시5-8","시144-150","사43-45","겔10-12","슥1-3","요10-12","엡4-6"],["창37-39","민13-15","수19-21","왕상10-12","대하22-24","시9-14","잠1-3","사46-48","겔13-15","슥4-6","요13-15","빌1-4"]];
        
        // 2. 퀴즈 데이터 및 로직 (기존 텍스트 생략, 축약하여 예시로 넣음 - 실제 코드에는 전체를 넣으세요)
        const rawQuizText = `
1. 하나님께서 첫째 날 창조하신 것은 무엇입니까? / 정답: 빛
2. 아담과 하와가 낳은 첫 번째 아들의 이름은 무엇입니까? / 정답: 가인
3. 노아의 방주에 탄 사람은 모두 몇 명입니까? / 정답: 8명 (노아, 노아의 아내, 세 아들, 세 며느리)
`; // 기존 500개 데이터를 여기에 그대로 유지하세요.

        let allQuizzes = [];

        function initQuiz() {
            const lines = rawQuizText.split('\n');
            for(let line of lines) {
                if(line.includes('/ 정답:')) {
                    let parts = line.split('/ 정답:');
                    let qText = parts[0].trim().replace(/^\d+\.\s*/, '');
                    let aText = parts[1].trim();
                    allQuizzes.push({ q: qText, a: aText });
                }
            }
            refreshQuiz();
        }

        function refreshQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            let shuffled = [...allQuizzes].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, 10);

            selected.forEach((quiz, idx) => {
                let html = `
                <div class="quiz-item" onclick="toggleQuiz(this)">
                    <div class="quiz-question"><span class="q-mark">Q${idx+1}.</span> <div>${quiz.q}</div></div>
                    <div class="quiz-answer">정답: ${quiz.a}</div>
                </div>`;
                container.innerHTML += html;
            });
        }

        // 퀴즈 정답 아코디언 토글
        function toggleQuiz(element) {
            const answer = element.querySelector('.quiz-answer');
            answer.classList.toggle('show');
        }

        // 3. 모달 제어 함수들 모음
        function openModal(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow = 'auto'; }

        function openQuizModal() { openModal('quizModal'); }
        function closeQuizModal() { closeModal('quizModal'); }
        function openScriptureModal() { openModal('scriptureModal'); }
        function closeScriptureModal() { closeModal('scriptureModal'); }
        function openAfternoonScriptureModal() { openModal('afternoonScriptureModal'); }
        function closeAfternoonScriptureModal() { closeModal('afternoonScriptureModal'); }
        function openBibleModal() { openModal('bibleModal'); }
        function closeBibleModal() { closeModal('bibleModal'); }
        function openGiveModal() { openModal('giveModal'); }
        function closeGiveModal() { closeModal('giveModal'); }
        function openMannaModal() { 
            openModal('mannaModal'); 
            initScratchCard(); // 열릴 때 스크래치 초기화
        }
        function closeMannaModal() { closeModal('mannaModal'); }

        // 4. 출석 체크 (스탬프 + 폭죽 애니메이션)
        function checkAttendance(btn, type) {
            const stamp = document.getElementById(`stamp-${type}`);
            stamp.classList.add('stamp-animate');
            btn.innerHTML = `<i class="fas fa-check-double text-green-500"></i>출석완료`;
            btn.classList.replace('text-rose-600', 'text-green-600');
            btn.classList.replace('text-purple-600', 'text-green-600');
            btn.classList.replace('text-sky-500', 'text-green-600');
            btn.disabled = true;

            // 폭죽 효과 (Confetti CDN 이용)
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#E11D48', '#FDA4AF', '#FCD34D']
            });
        }

        // 5. 스크롤 페이드인 효과 (Intersection Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });

        // 6. 1년 통독표 렌더링 함수
        function renderBibleTable() {
            const weekDays = ['주일', '월', '화', '수', '목', '금', '토'];
            const tbody = document.getElementById('bible-full-body');
            const weeklyGrid = document.getElementById('weekly-bible-grid');
            
            // 전체 통독표 모달 렌더링
            let tableHTML = '';
            fullBibleData.forEach((row, i) => {
                tableHTML += `<tr><td class="day-cell-fixed">주차${i+1}</td>`;
                row.forEach(cell => {
                    tableHTML += `<td>${cell}</td>`;
                });
                tableHTML += `</tr>`;
            });
            if(tbody) tbody.innerHTML = tableHTML;

            // 이번주 통독표 (예: 첫번째 배열 렌더링)
            if(weeklyGrid) {
                let weeklyHTML = '';
                weekDays.forEach((day, idx) => {
                    weeklyHTML += `
                    <div class="flex flex-col items-center justify-center p-2 rounded-xl border ${idx === 0 ? 'bg-rose-50 border-rose-200' : 'bg-white border-slate-100'} shadow-sm">
                        <span class="text-[10px] font-black ${idx === 0 ? 'text-rose-600' : 'text-slate-400'} mb-1">${day}</span>
                        <span class="text-[11px] font-bold text-slate-700 text-center leading-tight">${fullBibleData[0][idx] || '-'}</span>
                    </div>`;
                });
                weeklyGrid.innerHTML = weeklyHTML;
            }
        }

        // 7. 은혜 온도계 애니메이션
        function animateThermometer() {
            setTimeout(() => {
                document.getElementById('grace-thermometer').style.height = '85%';
                
                // 숫자 카운트 애니메이션
                let count = 0;
                let target = 85;
                let counter = setInterval(() => {
                    if(count >= target) clearInterval(counter);
                    else {
                        count++;
                        document.getElementById('temp-num').innerText = count + '°';
                    }
                }, 25);
            }, 500);
        }

        // 8. 만나 스크래치 복권 효과 (Canvas)
        function initScratchCard() {
            const canvas = document.getElementById('scratch-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const verses = ["항상 기뻐하라 (살전 5:16)", "여호와는 나의 목자시니 (시 23:1)", "내가 너와 함께 함이라 (사 41:10)"];
            document.getElementById('manna-ref').innerText = verses[Math.floor(Math.random() * verses.length)];
            
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            
            // 은색 코팅 덮기
            ctx.fillStyle = '#CBD5E1'; // slate-300
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 20px Pretendard";
            ctx.fillStyle = "#94A3B8";
            ctx.textAlign = "center";
            ctx.fillText("이곳을 문질러보세요", canvas.width/2, canvas.height/2);

            let isDrawing = false;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.lineWidth = 40; // 지워지는 펜 굵기

            function scratch(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                
                ctx.globalCompositeOperation = "destination-out"; // 이 모드가 '지우개' 역할
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2, false);
                ctx.fill();

                // 텍스트 보이게 하기
                document.getElementById('manna-ref').style.opacity = '1';
            }

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('touchstart', () => isDrawing = true, {passive: false});
            canvas.addEventListener('touchmove', scratch, {passive: false});
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        // 페이지 로드 시 실행할 초기화 함수들
        window.onload = () => {
            initQuiz();
            renderBibleTable();
            animateThermometer();
            document.querySelectorAll('.reveal-on-scroll').forEach((el) => observer.observe(el));
        };
    </script>
